stages:
    - test
    - package-check
    - release-check
    - build
    - publish
    - container

variables:
    NUKE_TELEMETRY_OPTOUT: "1" # Disable telemetry
    IGNORE_NORMALISATION_GIT_HEAD_MOVE: "1"
    # To overwrite them, just set them in the CI/CD settings (or change here)
    DOTNET_VERSION: "10.0"
    PUBLISH_SELF_CONTAINED: "true"
    PUBLISH_SINGLE_FILE: "true"
    PUBLISH_TRIMMED: "true"
    GITLAB_REPOSITORY_PATH: "$CI_PROJECT_PATH"

# ------------------------------------------------------------
# Shared templates used by every job: same image, same tools.
# No container engine (docker/podman/dind) is required anywhere:
#   * the per-commit image build writes a throwaway archive
#   * the release push is done by the .NET SDK directly over HTTP
# So this runs identically on GitLab shared runners and local runners.
# ------------------------------------------------------------
.build_job_template: &build_job_template
    image: mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}
    artifacts:
        expire_in: 1 week

# curl and bash come from the SDK image only after an apt refresh; dpkg-dev builds the Debian packages.
.build_tools: &build_tools
    before_script:
        - apt-get update -yqq
        - apt-get install -yqq --no-install-recommends curl ca-certificates bash dpkg-dev

# makensis builds the Windows installer on Linux, so the Windows release assets are produced here too.
.build_nsis: &build_nsis
    before_script:
        - apt-get install -yqq nsis

# build the project on every commit
test:
    <<: *build_job_template
    stage: test
    rules:
        - if: '$CI_COMMIT_TAG'
          when: never
        - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "web"'
          allow_failure: false
    before_script:
        - !reference [.build_tools, before_script]
    script:
        - |
            ./build.sh Restore Compile TestReport Publish ContainerBuild \
              --configuration "Debug" \
              --verbosity minimal
        - set +e; bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage/coverage.xml
    coverage: '/^  Line coverage: (\d*.\d*)%/'
    artifacts:
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage/coverage.xml

# Validate every release format without tagging or pushing.
package-check:
    <<: *build_job_template
    stage: package-check
    rules:
        - if: '$CI_COMMIT_TAG'
          when: never
        - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "web"'
    before_script:
        - !reference [.build_tools, before_script]
        - !reference [.build_nsis, before_script]
    script:
        - |
            ./build.sh Pack DebianPackage \
              --configuration "Release" \
              --runtime-identifier "linux-x64" \
              --verbosity minimal
        - |
            ./build.sh WingetManifest \
              --configuration "Release" \
              --runtime-identifier "win-x64" \
              --packaging-dry-run \
              --verbosity minimal

# Checks for commits since the last tag; if there are any, updates CHANGELOG.md, tags the release and
# pushes the commit+tag to this GitLab project. The pushed tag triggers this same pipeline's
# build/publish/container stages on the new tag ref.
release-check:
    <<: *build_job_template
    stage: release-check
    rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    before_script:
        - !reference [.build_tools, before_script]
    script:
        - |
            ./build.sh GitLabCreateTag \
              --gitlab-project-path "$GITLAB_REPOSITORY_PATH" \
              --gitlab-token "$GITLAB_PRIVATE_TOKEN" \
              --release-branch "$CI_DEFAULT_BRANCH" \
              --verbosity minimal

# Pack the published binaries, the Windows installer and the Debian packages on every tag.
build:
    <<: *build_job_template
    stage: build
    parallel:
        matrix:
            - RID: "win-x64"
            - RID: "linux-x64"
            - RID: "linux-musl-x64"
            - RID: "linux-arm64"
    rules:
        - if: '$CI_COMMIT_TAG'
          allow_failure: false
    before_script:
        - !reference [.build_tools, before_script]
        - !reference [.build_nsis, before_script]
    script:
        - |
            ./build.sh Pack DebianPackage \
              --configuration "Release" \
              --runtime-identifier "$RID" \
              --publish-self-contained "$PUBLISH_SELF_CONTAINED" \
              --publish-single-file "$PUBLISH_SINGLE_FILE" \
              --publish-trimmed "$PUBLISH_TRIMMED" \
              --verbosity minimal
    artifacts:
        paths:
            - artifacts/*

# GitLab.com doesn't provide a macOS shared runner by default. Wire a "macos" runner tag here once
# one is provisioned; until then this stays manual so it never blocks the release.
build-macos:
    tags: ["macos"]
    stage: build
    rules:
        - if: '$CI_COMMIT_TAG'
          when: manual
          allow_failure: true
    script:
        - |
            ./build.sh Pack \
              --configuration "Release" \
              --runtime-identifier "osx-x64" \
              --publish-self-contained "$PUBLISH_SELF_CONTAINED" \
              --publish-single-file "$PUBLISH_SINGLE_FILE" \
              --publish-trimmed "$PUBLISH_TRIMMED" \
              --verbosity minimal
    artifacts:
        paths:
            - artifacts/*.zip

# Uploads every archive produced by the build stage and links it from the GitLab release.
gitlab-release:
    <<: *build_job_template
    stage: publish
    rules:
        - if: '$CI_COMMIT_TAG'
          allow_failure: false
    needs:
        - build
        - job: build-macos
          optional: true
    before_script:
        - !reference [.build_tools, before_script]
    script:
        - |
            ./build.sh GitLabCreateRelease \
              --gitlab-project-path "$GITLAB_REPOSITORY_PATH" \
              --gitlab-token "$GITLAB_PRIVATE_TOKEN" \
              --verbosity minimal

# Pushes the container image to this project's GitLab Container Registry. The image is pushed directly
# by the .NET SDK over HTTP, so no Docker/Podman daemon is required here.
container:
    <<: *build_job_template
    stage: container
    parallel:
        matrix:
            - RID: "linux-x64"
            - RID: "linux-musl-x64"
            - RID: "linux-arm64"
    rules:
        - if: '$CI_COMMIT_TAG'
          allow_failure: true
    before_script:
        - !reference [.build_tools, before_script]
    script:
        - |
            ./build.sh ContainerPush \
              --configuration "Release" \
              --runtime-identifier "$RID" \
              --publish-self-contained "$PUBLISH_SELF_CONTAINED" \
              --publish-single-file "$PUBLISH_SINGLE_FILE" \
              --publish-trimmed "$PUBLISH_TRIMMED" \
              --container-registries "$CI_REGISTRY_IMAGE" \
              --container-registry-user "$CI_REGISTRY_USER" \
              --container-registry-password "$CI_REGISTRY_PASSWORD" \
              --verbosity minimal