name: publish-debian

# Mirrors the GitLab `publish-debian` job: builds Debian packages on every tag
# and uploads them as GitHub release assets.
on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to publish (for example, v1.2.3)
                required: true
                type: string

permissions:
    contents: write

jobs:
    publish-debian:
        name: publish-debian (${{ matrix.rid }})
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                rid: [linux-x64, linux-arm64]
        env:
            NUKE_TELEMETRY_OPTOUT: "1"
            IGNORE_NORMALISATION_GIT_HEAD_MOVE: "1"

            # Default publishing flags (overridable in the workflow)
            PUBLISH_SELF_CONTAINED: "true"
            PUBLISH_SINGLE_FILE: "true"
            PUBLISH_TRIMMED: "true"

            GITHUB_TOKEN: ${{ github.token }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.tag || github.ref }}
                  fetch-depth: 0
                  fetch-tags: true

            - name: Install tools
              run: |
                  sudo apt-get update -yqq
                  sudo apt-get install -yqq --no-install-recommends curl ca-certificates bash dpkg-dev nsis

            - name: Publish Debian package
              run: |
                  ./build.sh Restore Publish CreateDebianPackage GitHubPushDebianPackage \
                    --runtime-identifier ${{ matrix.rid }} \
                    --publish-directory "./publish/fanstatic-${{ matrix.rid }}" \
                    --publish-self-contained $PUBLISH_SELF_CONTAINED \
                    --publish-single-file $PUBLISH_SINGLE_FILE \
                    --publish-trimmed $PUBLISH_TRIMMED
