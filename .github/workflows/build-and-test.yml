name: Build and test

# Mirrors the GitLab `test` job: build on every commit (except tags and schedules).
# `push` is limited to the default branch: a branch with an open pull request already runs this
# workflow through `pull_request`, and triggering on both would run every job twice per commit.
on:
    push:
        branches-ignore:
            - "renovate/**"
        tags-ignore:
            - "v*"
    pull_request:

permissions:
    contents: read

concurrency:
    group: build-and-test-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-26.04
        permissions:
            contents: read
        env:
            NUKE_TELEMETRY_OPTOUT: "1"
            IGNORE_NORMALISATION_GIT_HEAD_MOVE: "1"
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: Install tools
              run: |
                  sudo apt-get update -yqq
                  sudo apt-get install -yqq --no-install-recommends curl ca-certificates bash dpkg-dev

            - name: Restore, compile and test
              run: |
                  ./build.sh Restore Compile TestReport \
                    --configuration "Debug" \
                    --verbosity minimal

            - name: Upload coverage report
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report
                  path: coverage/report/*
                  if-no-files-found: error

    benchmark:
        runs-on: ubuntu-26.04
        permissions:
            contents: read
        env:
            NUKE_TELEMETRY_OPTOUT: "1"
            IGNORE_NORMALISATION_GIT_HEAD_MOVE: "1"
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"

            - name: Run performance benchmarks
              run: ./build.sh Benchmark --configuration Release --runtime-identifier linux-x64

            - name: Upload benchmark results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: benchmark-results
                  path: artifacts/benchmark.json
                  if-no-files-found: error

    # Validate every Linux release format, without tagging or pushing.
    package:
        runs-on: ubuntu-26.04
        permissions:
            contents: read
        env:
            NUKE_TELEMETRY_OPTOUT: "1"
            IGNORE_NORMALISATION_GIT_HEAD_MOVE: "1"
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: Install tools
              run: |
                  sudo apt-get update -yqq
                  sudo apt-get install -yqq --no-install-recommends curl ca-certificates bash dpkg-dev

            - name: Pack Linux archive and Debian package
              run: |
                  ./build.sh Pack DebianPackage \
                    --configuration "Release" \
                    --runtime-identifier "linux-x64" \
                    --verbosity minimal

            - name: Upload packages
              uses: actions/upload-artifact@v7
              with:
                  name: packages
                  path: artifacts/*
                  if-no-files-found: error

    # Windows artifacts are built where they can run: pack, install, use and uninstall the installer, then
    # validate the Winget manifests. Mirrors the GitLab `package-check-windows` job.
    windows:
        runs-on: windows-2025
        permissions:
            contents: read
        env:
            NUKE_TELEMETRY_OPTOUT: "1"
            IGNORE_NORMALISATION_GIT_HEAD_MOVE: "1"
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: Install NSIS
              run: choco install nsis --no-progress -y

            - name: Pack, test the installer and validate the Winget manifests
              run: ./build.ps1 Pack WingetManifest WindowsInstallerTest WingetValidate --configuration Release --runtime-identifier win-x64 --packaging-dry-run --verbosity minimal

            - name: Upload packages
              uses: actions/upload-artifact@v7
              with:
                  name: windows-packages
                  path: artifacts/*
                  if-no-files-found: error
