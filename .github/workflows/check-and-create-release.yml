name: check-and-create-release

# Mirrors the GitLab `check-and-create-release` job: runs on a schedule or
# manually. If there are new commits since the last tag, it bumps versions,
# updates the changelog, pushes the commit and creates the tag + release.
# Requires a PAT in the `ADMIN_ACCESS_TOKEN` secret so the created tag triggers
# the `publish` workflows.
# When falling back to `github.token`, tag-triggered publish must be run manually.
on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

permissions:
    contents: write
    packages: write

jobs:
    check-and-create-release:
        runs-on: ubuntu-24.04
        env:
            NUKE_TELEMETRY_OPTOUT: "1"
            IGNORE_NORMALISATION_GIT_HEAD_MOVE: "1"
            ADMIN_ACCESS_TOKEN: ${{ secrets.ADMIN_ACCESS_TOKEN || github.token }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.ref }}
                  fetch-depth: 0
                  fetch-tags: true
                  token: ${{ secrets.ADMIN_ACCESS_TOKEN || github.token }}

            - name: Install tools
              run: |
                  sudo apt-get update -yqq
                  sudo apt-get install -yqq --no-install-recommends curl ca-certificates bash dpkg-dev nsis

            - name: Create release
              run: |
                  ./build.sh GitHubCreateRelease
