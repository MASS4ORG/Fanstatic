name: build-test

# Mirrors the GitLab `test` job: build on every commit (except tags and schedules).
on:
    push:
        branches: ["**"]
    pull_request:

permissions:
    contents: read

concurrency:
    group: build-test-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-test:
        runs-on: ubuntu-24.04
        env:
            NUKE_TELEMETRY_OPTOUT: "1"
            IGNORE_NORMALISATION_GIT_HEAD_MOVE: "1"
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: Install tools
              run: |
                  sudo apt-get update -yqq
                  sudo apt-get install -yqq --no-install-recommends curl ca-certificates bash dpkg-dev nsis

            - name: Restore, compile, test and package
              run: |
                  ./build.sh Restore Compile TestReport Publish CreateContainer \
                    --configuration "Debug" \
                    --publish-directory "./publish"

            - name: Publish coverage to Codacy
              continue-on-error: true
              run: |
                  set +e
                  bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage/coverage.xml
              env:
                  CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

            - name: Upload coverage report
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report
                  path: coverage/report/*
                  if-no-files-found: error

            - name: Upload build output
              uses: actions/upload-artifact@v7
              with:
                  name: publish
                  path: publish/*
                  if-no-files-found: error
